<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>TagImg · 作品</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3ET%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="layout-tools" class="layout-tools">
      <button
        id="layout-toggle"
        class="layout-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="layout-panel"
        title="调整排版"
      >
        <span aria-hidden="true">▦</span>
        <span class="visually-hidden">调整排版</span>
      </button>
      <div id="layout-panel" class="layout-panel" hidden>
        <div class="layout-panel-head">
          <span>调整排版</span>
          <button
            id="layout-close"
            class="layout-close"
            type="button"
            aria-label="关闭排版设置"
          >
            ×
          </button>
        </div>
        <label class="layout-field" for="layout-col-gap">
          <span>列距 <output id="layout-col-gap-value">18</output></span>
          <input
            id="layout-col-gap"
            type="range"
            min="0"
            max="40"
            step="1"
            value="18"
          />
        </label>
        <label class="layout-field" for="layout-row-gap">
          <span>行距 <output id="layout-row-gap-value">18</output></span>
          <input
            id="layout-row-gap"
            type="range"
            min="0"
            max="40"
            step="1"
            value="18"
          />
        </label>
        <label class="layout-field" for="layout-radius">
          <span>圆角 <output id="layout-radius-value">14</output></span>
          <input
            id="layout-radius"
            type="range"
            min="0"
            max="40"
            step="1"
            value="14"
          />
        </label>
        <div class="layout-mode" role="group" aria-label="排版方向">
          <button
            id="layout-mode-vertical"
            class="layout-mode-button active"
            type="button"
            aria-pressed="true"
          >
            纵向
          </button>
          <button
            id="layout-mode-horizontal"
            class="layout-mode-button"
            type="button"
            aria-pressed="false"
          >
            横向
          </button>
        </div>
        <label id="layout-columns-field" class="layout-field" for="layout-columns">
          <span>列数 <output id="layout-columns-value">4</output></span>
          <input
            id="layout-columns"
            type="range"
            min="1"
            max="8"
            step="1"
            value="4"
          />
        </label>
        <label id="layout-height-field" class="layout-field" for="layout-height" hidden>
          <span>高度 <output id="layout-height-value">240</output></span>
          <input
            id="layout-height"
            type="range"
            min="100"
            max="500"
            step="10"
            value="240"
          />
        </label>
      </div>
    </div>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark">T</span>
          <span class="brand-name">TagImg</span>
        </div>
        <form id="search-form" class="search" role="search">
          <label class="visually-hidden" for="search-input">按标题搜索</label>
          <input
            id="search-input"
            type="search"
            name="title"
            placeholder="按标题搜索作品…"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit">搜索</button>
        </form>
        <div class="tag-search">
          <label class="visually-hidden" for="tag-input">按标签搜索</label>
          <input
            id="tag-input"
            type="search"
            placeholder="输入标签名或路径…"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="tag-suggest"
            title="选中后按回车加入包含，Shift+回车加入不包含"
          />
          <ul id="tag-suggest" class="tag-suggest" role="listbox" hidden></ul>
        </div>
        <div id="sort-search" class="sort-search">
          <label class="visually-hidden" for="sort-input">按文字排序</label>
          <input
            id="sort-input"
            type="search"
            placeholder="按文字排序…"
            autocomplete="off"
            spellcheck="false"
            title="输入描述后按回车，按作品图片与该描述的语义相似度排序；再次清空可取消"
          />
          <button
            id="sort-clear"
            class="sort-clear"
            type="button"
            aria-label="取消文字排序"
            hidden
          >
            ×
          </button>
        </div>
        <div class="topbar-actions">
          <a class="top-link" href="/orphans.html">游离图片</a>
          <button
            id="add-button"
            class="add-button"
            type="button"
            aria-haspopup="dialog"
          >
            添加
          </button>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="toolbar">
        <div id="tag-staging" class="tag-staging" hidden>
          <div id="include-stage-row" class="tag-stage" hidden>
            <span class="tag-stage-label">包含</span>
            <div id="include-stage" class="tag-stage-list"></div>
          </div>
          <div id="exclude-stage-row" class="tag-stage" hidden>
            <span class="tag-stage-label">不包含</span>
            <div id="exclude-stage" class="tag-stage-list"></div>
          </div>
        </div>
        <p id="status" class="status" hidden></p>
      </div>

      <section
        id="results"
        class="masonry-grid"
        aria-live="polite"
      ></section>
    </main>

    <dialog id="add-dialog" class="dialog">
      <form id="add-form" class="dialog-form">
        <header class="dialog-head">
          <h2>添加作品</h2>
          <button
            id="add-close"
            class="icon-button"
            type="button"
            aria-label="关闭"
          >
            ×
          </button>
        </header>

        <div class="dialog-body">
          <div class="field">
            <span class="field-label">添加模式</span>
            <div class="mode-options" role="radiogroup" aria-label="添加模式">
              <label class="mode-option">
                <input
                  type="radio"
                  name="add-mode"
                  value="artwork"
                  checked
                />
                <span>作品模式</span>
              </label>
              <label class="mode-option">
                <input type="radio" name="add-mode" value="oneimg" />
                <span>单图模式</span>
              </label>
            </div>
            <span id="add-mode-hint" class="hint">
              所有实体合成一个作品
            </span>
          </div>

          <label class="field">
            <span class="field-label">
              统一标题
              <span id="add-title-hint" class="hint">必填</span>
            </span>
            <input
              id="add-title"
              type="text"
              maxlength="500"
              autocomplete="off"
              placeholder="作品标题"
            />
          </label>

          <label class="field">
            <span class="field-label">
              实体 ID
              <span class="hint">一行一个，1–20 个</span>
            </span>
            <textarea
              id="add-entities"
              rows="5"
              spellcheck="false"
              placeholder="66102173-d129-4b65-b104-d5ac5e44f493&#10;5afd15d5-4202-4967-a1ac-7a42737746e4"
            ></textarea>
          </label>
          <p id="entity-count" class="hint entity-count"></p>

          <div class="field">
            <label class="field-label" for="add-tag-input">
              标签
              <span class="hint">可选，应用到每个作品</span>
            </label>
            <div class="tag-search dialog-tag-search">
              <input
                id="add-tag-input"
                type="search"
                placeholder="输入标签名或路径…"
                autocomplete="off"
                spellcheck="false"
                role="combobox"
                aria-autocomplete="list"
                aria-expanded="false"
                aria-controls="add-tag-suggest"
                title="回车加入标签列表"
              />
              <ul
                id="add-tag-suggest"
                class="tag-suggest"
                role="listbox"
                hidden
              ></ul>
            </div>
            <div
              id="add-tag-stage"
              class="tag-stage-list dialog-tag-stage"
              hidden
            ></div>
          </div>

          <label class="field">
            <span class="field-label">
              描述
              <span class="hint">可选</span>
            </span>
            <textarea id="add-description" rows="2"></textarea>
          </label>

          <label id="add-published-field" class="field">
            <span class="field-label">
              发布时间
              <span class="hint">可选，如 2026-04-05T06:07:08Z</span>
            </span>
            <input
              id="add-published"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="2026-04-05T06:07:08Z"
            />
          </label>

          <p id="add-error" class="form-error" hidden></p>
        </div>

        <footer class="dialog-foot">
          <button id="add-cancel" class="button ghost" type="button">
            取消
          </button>
          <button id="add-submit" class="button primary" type="submit">
            添加
          </button>
        </footer>
      </form>
    </dialog>

    <script src="/tag-search.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
