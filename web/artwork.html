<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>作品详情 · TagImg</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3ET%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/lightbox.css" />
    <link rel="stylesheet" href="/confirm-dialog.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <span class="brand-mark">T</span>
          <span class="brand-name">TagImg</span>
        </a>
        <div class="topbar-actions">
          <button
            id="edit-button"
            class="button ghost"
            type="button"
            aria-pressed="false"
            hidden
          >
            编辑
          </button>
          <button id="rescan-button" class="button ghost" type="button" hidden>
            重扫
          </button>
          <button id="delete-button" class="button danger" type="button" hidden>
            删除
          </button>
          <a class="top-link" href="/">返回作品列表</a>
        </div>
      </div>
    </header>

    <main class="page">
      <p id="status" class="status" hidden></p>

      <article id="artwork" class="detail" hidden>
        <header class="detail-head">
          <h1 id="detail-title" class="detail-title"></h1>
          <div id="edit-fields" class="edit-fields" hidden>
            <label class="edit-field">
              <span class="field-label">标题</span>
              <input
                id="edit-title"
                type="text"
                maxlength="500"
                autocomplete="off"
              />
            </label>
            <label class="edit-field">
              <span class="field-label">发布时间</span>
              <input id="edit-published" type="datetime-local" step="1" />
            </label>
          </div>
          <div id="detail-meta" class="meta detail-meta"></div>
        </header>

        <p id="detail-description" class="detail-description" hidden></p>

        <section id="images-section" class="detail-section">
          <h2 class="section-title">
            图片
            <span id="image-count" class="hint"></span>
          </h2>
          <div id="gallery" class="gallery"></div>
          <p id="edit-gallery-hint" class="hint edit-gallery-hint" hidden>
            拖动图片到另一张图片上可交换位置；点击图片进入选择排序，按点击顺序编号，点击空白完成。
          </p>
        </section>

        <section id="artists-section" class="detail-section" hidden>
          <h2 class="section-title">画师</h2>
          <div id="detail-artists" class="tags"></div>
        </section>

        <section id="tags-section" class="detail-section" hidden>
          <h2 class="section-title">标签</h2>
          <div id="detail-tags" class="tags"></div>
          <div id="edit-tag-search" class="tag-search edit-tag-search" hidden>
            <label class="visually-hidden" for="edit-tag-input">添加标签</label>
            <input
              id="edit-tag-input"
              type="search"
              placeholder="输入标签路径…"
              autocomplete="off"
              spellcheck="false"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="edit-tag-suggest"
            />
            <ul
              id="edit-tag-suggest"
              class="tag-suggest"
              role="listbox"
              hidden
            ></ul>
          </div>
          <p id="edit-tag-hint" class="hint edit-tag-hint" hidden>
            回车加入标签；点击已有标签标记删除。
          </p>
        </section>
      </article>

      <div id="edit-save-bar" class="edit-save-bar" hidden>
        <button id="edit-save" class="button primary" type="button">
          保存
        </button>
      </div>
    </main>

    <script src="/tag-search.js"></script>
    <script src="/confirm-dialog.js"></script>
    <script type="module" src="/artwork.js"></script>
  </body>
</html>
