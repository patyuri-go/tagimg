<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>作品详情 · TagImg</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3ET%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <span class="brand-mark">T</span>
          <span class="brand-name">TagImg</span>
        </a>
        <div class="topbar-actions">
          <button
            id="edit-button"
            class="button ghost"
            type="button"
            aria-pressed="false"
            hidden
          >
            编辑
          </button>
          <button id="delete-button" class="button danger" type="button" hidden>
            删除
          </button>
          <a class="top-link" href="/">返回作品列表</a>
        </div>
      </div>
    </header>

    <main class="page">
      <p id="status" class="status" hidden></p>

      <article id="artwork" class="detail" hidden>
        <header class="detail-head">
          <h1 id="detail-title" class="detail-title"></h1>
          <div id="detail-meta" class="meta detail-meta"></div>
        </header>

        <p id="detail-description" class="detail-description" hidden></p>

        <section id="images-section" class="detail-section">
          <h2 class="section-title">
            图片
            <span id="image-count" class="hint"></span>
          </h2>
          <div id="gallery" class="gallery"></div>
        </section>

        <section id="artists-section" class="detail-section" hidden>
          <h2 class="section-title">画师</h2>
          <div id="detail-artists" class="tags"></div>
        </section>

        <section id="tags-section" class="detail-section" hidden>
          <h2 class="section-title">标签</h2>
          <div id="detail-tags" class="tags"></div>
        </section>
      </article>
    </main>

    <script src="/artwork.js"></script>
  </body>
</html>
