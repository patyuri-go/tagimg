<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>TagImg · 图片</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3ET%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="images-page">
    <div id="layout-tools" class="layout-tools">
      <button
        id="layout-toggle"
        class="layout-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="layout-panel"
        title="调整排版"
      >
        <span aria-hidden="true">▦</span>
        <span class="visually-hidden">调整排版</span>
      </button>
      <div id="layout-panel" class="layout-panel" hidden>
        <div class="layout-panel-head">
          <span>调整排版</span>
          <button
            id="layout-close"
            class="layout-close"
            type="button"
            aria-label="关闭排版设置"
          >
            ×
          </button>
        </div>
        <label class="layout-field" for="layout-col-gap">
          <span>列距 <output id="layout-col-gap-value">18</output></span>
          <input
            id="layout-col-gap"
            type="range"
            min="0"
            max="40"
            step="1"
            value="18"
          />
        </label>
        <label class="layout-field" for="layout-row-gap">
          <span>行距 <output id="layout-row-gap-value">18</output></span>
          <input
            id="layout-row-gap"
            type="range"
            min="0"
            max="40"
            step="1"
            value="18"
          />
        </label>
        <label class="layout-field" for="layout-radius">
          <span>圆角 <output id="layout-radius-value">14</output></span>
          <input
            id="layout-radius"
            type="range"
            min="0"
            max="40"
            step="1"
            value="14"
          />
        </label>
        <div class="layout-mode" role="group" aria-label="排版方向">
          <button
            id="layout-mode-vertical"
            class="layout-mode-button active"
            type="button"
            aria-pressed="true"
          >
            纵向
          </button>
          <button
            id="layout-mode-horizontal"
            class="layout-mode-button"
            type="button"
            aria-pressed="false"
          >
            横向
          </button>
        </div>
        <label id="layout-columns-field" class="layout-field" for="layout-columns">
          <span>列数 <output id="layout-columns-value">4</output></span>
          <input
            id="layout-columns"
            type="range"
            min="1"
            max="8"
            step="1"
            value="4"
          />
        </label>
        <label id="layout-height-field" class="layout-field" for="layout-height" hidden>
          <span>高度 <output id="layout-height-value">240</output></span>
          <input
            id="layout-height"
            type="range"
            min="100"
            max="500"
            step="10"
            value="240"
          />
        </label>
      </div>
    </div>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <span class="brand-mark">T</span>
          <span class="brand-name">TagImg</span>
        </a>
        <div class="tag-search">
          <label class="visually-hidden" for="tag-input">按标签筛选图片</label>
          <input
            id="tag-input"
            type="search"
            placeholder="输入标签名或路径…"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="tag-suggest"
            title="选中后按回车加入包含，Shift+回车加入不包含"
          />
          <ul id="tag-suggest" class="tag-suggest" role="listbox" hidden></ul>
        </div>
        <div class="image-order-wrap">
          <label class="visually-hidden" for="image-order">排序方式</label>
          <select id="image-order" class="image-order">
            <option value="created">创建时间</option>
            <option value="published">发布时间</option>
            <option value="scan">扫描时间</option>
            <option value="similarity">相似度</option>
          </select>
        </div>
        <div id="image-sort-search" class="sort-search" hidden>
          <label class="visually-hidden" for="image-sort-input">
            按文字排序
          </label>
          <input
            id="image-sort-input"
            type="search"
            placeholder="描述画面，回车排序…"
            autocomplete="off"
            spellcheck="false"
            title="输入描述后按回车，按图片与该描述的语义相似度排序；清空可取消"
          />
          <button
            id="image-sort-clear"
            class="sort-clear"
            type="button"
            aria-label="取消文字排序"
            hidden
          >
            ×
          </button>
        </div>
        <div class="topbar-actions">
          <a class="top-link" href="/">作品搜索</a>
          <a class="top-link" href="/orphans.html">游离图片</a>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="toolbar">
        <div id="image-reference" class="image-reference" hidden>
          <img id="image-reference-thumb" alt="" decoding="async" />
          <div class="image-reference-info">
            <span class="image-reference-label">相似图查询</span>
            <span id="image-reference-id" class="image-reference-id"></span>
          </div>
          <button
            id="image-reference-clear"
            class="button ghost image-reference-clear"
            type="button"
          >
            取消
          </button>
        </div>
        <div id="tag-staging" class="tag-staging" hidden>
          <div id="include-stage-row" class="tag-stage" hidden>
            <span class="tag-stage-label">包含</span>
            <div id="include-stage" class="tag-stage-list"></div>
            <button
              id="include-mode-toggle"
              class="tag-stage-mode"
              type="button"
              aria-label="切换包含标签匹配模式"
              title="当前 ALL，点击切换为 ANY"
              hidden
            >ALL</button>
          </div>
          <div id="exclude-stage-row" class="tag-stage" hidden>
            <span class="tag-stage-label">不包含</span>
            <div id="exclude-stage" class="tag-stage-list"></div>
          </div>
        </div>
        <p id="image-status" class="status" hidden></p>
      </div>

      <section
        id="image-results"
        class="masonry-grid"
        aria-live="polite"
      ></section>
    </main>

    <aside id="tag-drawer" class="tag-drawer" aria-label="标签树">
      <button
        id="tag-drawer-handle"
        class="tag-drawer-handle"
        type="button"
        aria-controls="tag-drawer-panel"
        aria-expanded="false"
      >
        <span>标签</span>
      </button>
      <div id="tag-drawer-panel" class="tag-drawer-panel" inert>
        <header class="tag-drawer-head">
          <h2 id="tag-drawer-title" class="tag-drawer-title">标签树</h2>
          <button
            id="tag-drawer-close"
            class="icon-button"
            type="button"
            aria-label="关闭标签树"
          >
            ×
          </button>
        </header>
        <div class="tag-drawer-tools">
          <div class="tag-tree-search-wrap">
            <input
              id="tag-tree-search"
              class="tag-tree-search"
              type="search"
              placeholder="搜索标签名或别名…"
              autocomplete="off"
              spellcheck="false"
              aria-label="搜索标签树"
            />
            <button
              id="tag-tree-search-clear"
              class="tag-tree-search-clear"
              type="button"
              aria-label="清空标签搜索"
              hidden
            >
              ×
            </button>
          </div>
          <button id="tag-edit-button" class="button tag-edit-button" type="button">
            编辑
          </button>
        </div>
        <p id="tag-tree-status" class="tag-tree-status" hidden></p>
        <div id="tag-tree" class="tag-tree" role="tree" aria-label="标签树"></div>
      </div>
    </aside>

    <dialog
      id="tag-editor"
      class="dialog tag-editor"
      aria-labelledby="tag-editor-title"
    >
      <form id="tag-editor-form" class="dialog-form">
        <header class="dialog-head">
          <h2 id="tag-editor-title">编辑标签</h2>
          <button
            id="tag-editor-close"
            class="icon-button"
            type="button"
            aria-label="关闭标签编辑"
          >
            ×
          </button>
        </header>

        <div class="dialog-body">
          <div
            id="tag-editor-tabs"
            class="tag-editor-tabs"
            role="tablist"
            aria-label="标签编辑模式"
          >
            <button
              id="tag-editor-mode-edit"
              class="tag-editor-tab"
              type="button"
              role="tab"
              aria-selected="true"
            >
              编辑
            </button>
            <button
              id="tag-editor-mode-add"
              class="tag-editor-tab"
              type="button"
              role="tab"
              aria-selected="false"
            >
              添加子标签
            </button>
          </div>

          <label class="field">
            <span class="field-label">标准名</span>
            <input
              id="tag-editor-name"
              type="text"
              maxlength="255"
              autocomplete="off"
              placeholder="标签标准名"
            />
          </label>

          <div class="field">
            <span class="field-label">
              别名
              <span class="hint">回车或逗号添加</span>
            </span>
            <div id="tag-editor-aliases" class="tag-editor-aliases"></div>
            <input
              id="tag-editor-alias-input"
              type="text"
              maxlength="255"
              autocomplete="off"
              placeholder="输入别名后按回车"
            />
          </div>

          <div id="tag-editor-parent-field" class="field">
            <span class="field-label">父标签</span>
            <div class="tag-editor-parent-row">
              <button
                id="tag-editor-parent-display"
                class="tag-editor-parent-display"
                type="button"
              >
                全局父节点
              </button>
              <button
                id="tag-editor-parent-clear"
                class="button ghost tag-editor-parent-clear"
                type="button"
              >
                全局父节点
              </button>
            </div>
            <div
              id="tag-editor-parent-search"
              class="tag-editor-parent-search"
              hidden
            >
              <input
                id="tag-editor-parent-input"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="输入标签名或路径…"
              />
              <ul
                id="tag-editor-parent-suggest"
                class="tag-suggest"
                role="listbox"
                hidden
              ></ul>
            </div>
          </div>

          <p id="tag-editor-error" class="form-error" hidden></p>
        </div>

        <footer class="dialog-foot">
          <button
            id="tag-editor-cancel"
            class="button ghost"
            type="button"
          >
            取消
          </button>
          <button id="tag-editor-save" class="button" type="button">保存</button>
        </footer>
      </form>
    </dialog>

    <aside
      id="selection-card"
      class="selection-card"
      aria-labelledby="selection-title"
      hidden
    >
      <header class="selection-card-head">
        <h2 id="selection-title" class="selection-card-title">
          已选 <span id="selection-count">0</span> 张
        </h2>
        <button
          id="selection-close"
          class="icon-button"
          type="button"
          aria-label="关闭批量标签"
        >
          ×
        </button>
      </header>

      <div class="selection-card-body">
        <section class="selection-section">
          <h3 class="selection-section-title">共同标签</h3>
          <div id="selection-common-tags" class="selection-tags"></div>
        </section>

        <section class="selection-section">
          <h3 class="selection-section-title">添加标签</h3>
          <div class="selection-tag-search">
            <input
              id="selection-tag-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              aria-label="搜索要添加的标签"
              placeholder="输入标签名或路径…"
            />
            <ul
              id="selection-tag-suggest"
              class="tag-suggest"
              role="listbox"
              hidden
            ></ul>
          </div>
        </section>

        <p id="selection-lock-hint" class="selection-hint" role="status" hidden>
          保存或取消后可继续选择
        </p>
        <p id="selection-error" class="form-error" role="alert" hidden></p>
      </div>

      <footer class="selection-card-foot">
        <button id="selection-cancel" class="button ghost" type="button">
          取消
        </button>
        <button
          id="selection-save"
          class="button primary"
          type="button"
          disabled
        >
          保存
        </button>
      </footer>
    </aside>

    <dialog
      id="image-lightbox"
      class="dialog image-lightbox"
      aria-labelledby="image-lightbox-caption"
    >
      <header class="dialog-head image-lightbox-head">
        <h2 id="image-lightbox-caption" class="lightbox-caption"></h2>
        <button
          id="image-lightbox-close"
          class="icon-button lightbox-close"
          type="button"
          aria-label="关闭图片浏览"
        >
          ×
        </button>
      </header>
      <div class="image-lightbox-body">
        <div id="image-lightbox-stage" class="image-lightbox-stage">
          <img id="image-lightbox-image" class="lightbox-image" alt="" />
          <p id="image-lightbox-error" class="lightbox-error" hidden>
            图片无法加载
          </p>
          <button
            id="image-lightbox-prev"
            class="lightbox-nav lightbox-prev"
            type="button"
            aria-label="上一张图片"
            title="上一张（←）"
          >
            ‹
          </button>
          <button
            id="image-lightbox-next"
            class="lightbox-nav lightbox-next"
            type="button"
            aria-label="下一张图片"
            title="下一张（→）"
          >
            ›
          </button>
        </div>
        <aside id="image-lightbox-side" class="image-lightbox-side">
          <a
            id="image-lightbox-similar"
            class="lightbox-similar-link"
            href="/images.html"
          >
            查找相似图片
          </a>
          <section class="image-info-section">
            <h3 class="image-info-title">所属作品</h3>
            <div
              id="image-lightbox-artworks"
              class="image-lightbox-artworks"
            ></div>
          </section>
          <section class="image-info-section">
            <h3 class="image-info-title">标签</h3>
            <div id="image-lightbox-tags" class="image-lightbox-tags"></div>
          </section>
          <section class="image-info-section">
            <h3 class="image-info-title">详情</h3>
            <dl id="image-lightbox-meta" class="image-meta"></dl>
          </section>
        </aside>
      </div>
    </dialog>

    <div id="hover-preview" class="hover-preview" hidden>
      <img alt="" decoding="async" />
    </div>

    <script src="/tag-search.js"></script>
    <script src="/images.js"></script>
  </body>
</html>
