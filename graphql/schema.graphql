schema {
  query: Query
  mutation: Mutation
}

"根查询类型。"
type Query {
  "服务健康检查，始终返回 ok。"
  ping: String!

  """
  按作品 ID 查询单条作品。

  ID 必须是合法 UUID，否则返回 INVALID_ARGUMENT 错误；
  作品不存在时返回 null，而不是错误。
  """
  artwork(id: ID!): Artwork

  """
  分页查询已入库的作品。

  所有过滤条件之间是 AND 关系；同一个数组内部是 OR 关系。

  orderBy 传 SIMILARITY 时必须同时传 sortText，此时按描述文本与作品图片向量的
  余弦相似度倒序排列，direction 固定为倒序；没有图片向量的作品排在最后。
  """
  artworks(
    "过滤条件，缺省时返回全部作品。"
    filter: ArtworkFilter
    "排序字段，默认按创建时间。"
    orderBy: ArtworkOrderField = CREATED_AT
    "排序方向，默认倒序。"
    direction: SortDirection = DESC
    "每页数量，1 到 100。"
    limit: Int = 20
    "跳过数量，0 到 10000。"
    offset: Int = 0
    "是否统计总数；为 true 时 total 才有值。"
    includeTotal: Boolean = false
    """
    按语义相似度排序时使用的描述文本，需配合 orderBy: SIMILARITY。

    长度不超过 512 个字符。
    """
    sortText: String
  ): ArtworkConnection!

  """
  分页查询已入库的图片。

  与 artworks 基本相同，但没有标题过滤。所有过滤条件之间是 AND 关系；
  同一个数组内部是 OR 关系。图片的标签来自 image_tags。

  orderBy 传 SIMILARITY 时必须同时传 sortText 或 referenceImageId 之一；
  传 referenceImageId 时，参考图自身不会出现在结果中，且只返回有向量的图片。
  """
  images(
    "过滤条件，缺省时返回全部图片。"
    filter: ImageFilter
    "排序字段，默认按创建时间。"
    orderBy: ImageOrderField = CREATED_AT
    "排序方向，默认倒序。"
    direction: SortDirection = DESC
    "每页数量，1 到 100。"
    limit: Int = 20
    "跳过数量，0 到 10000。"
    offset: Int = 0
    "是否统计总数；为 true 时 total 才有值。"
    includeTotal: Boolean = false
    """
    按语义相似度排序时使用的描述文本，需配合 orderBy: SIMILARITY。
    与 referenceImageId 二选一。

    长度不超过 512 个字符。
    """
    sortText: String
    """
    按参考图片相似度排序时使用的图片 ID，需配合 orderBy: SIMILARITY。
    与 sortText 二选一。参考图自身不会出现在结果中，结果只包含有向量的图片。
    """
    referenceImageId: ID
  ): ImageConnection!

  """
  按关键词搜索标签库，用于输入联想。

  同时匹配标准名和别名，忽略大小写。同一个标签命中多个名称时只返回一次，
  name 是命中的那个名称，tagPath 仍然使用标准名拼路径。

  scope 不传时在全部标签中搜索；scope.parentId 为 null 时只搜索全局根
  的直接子标签；scope.parentId 有值时搜索该标签的整棵子树。
  """
  tags(
    "关键词，匹配标签标准名或别名，忽略大小写，1 到 100 个字符。"
    query: String!
    "搜索范围，缺省时不限制父标签。"
    scope: TagSearchScope
    "返回条数，1 到 50，默认 10。"
    limit: Int = 10
  ): [TagMatch!]!

  """
  按父标签 ID 列出直接子标签，用于图片页标签树的懒加载。

  parentId 为 null 时列出所有顶层标签；没有子标签时返回空数组。
  """
  tagChildren(
    "父标签 ID；null 表示全局父节点。"
    parentId: ID
  ): [TagTreeNode!]!

  """
  按标准名或别名搜索全部标签，并返回每个命中节点的祖先链。

  与 tags 不同，这个查询不限制返回数量，返回完整节点信息和祖先的 ID，
  供树状展示和继续编辑使用。
  """
  tagTreeSearch(
    "关键词，匹配标签标准名或别名，忽略大小写，1 到 100 个字符。"
    query: String!
  ): [TagTreeMatch!]!

  """
  分页列出不属于任何作品的游离图片，按入库时间倒序。

  游离图片只会在删除作品后产生；删除前就已游离的图片同样会出现在列表里。
  """
  orphanImages(
    "每页数量，1 到 100。"
    limit: Int = 24
    "跳过数量，0 到 10000。"
    offset: Int = 0
    "是否统计总数；为 true 时 total 才有值。"
    includeTotal: Boolean = false
  ): OrphanImageConnection!
}

"作品过滤条件。"
input ArtworkFilter {
  "标题子串匹配，区分大小写按数据库默认排序规则，最多 500 个字符。"
  title: String
  "作品包含其中任一实体即命中。"
  entityIds: [ID!]
  "作品包含其中任一艺术家即命中。"
  artistIds: [ID!]

  "要求命中的标签 ID 集合。"
  includeTagIds: [ID!]
  "includeTagIds 的匹配方式，默认全部命中。"
  includeMode: TagMatchMode = ALL
  "includeTagIds 是否递归包含后代标签。"
  expandIncludeTagDescendants: Boolean = false

  "要求排除的标签 ID 集合，作品不能命中其中任何一个。"
  excludeTagIds: [ID!]
  "excludeTagIds 是否递归包含后代标签。"
  expandExcludeTagDescendants: Boolean = false
}

"图片过滤条件。与作品过滤条件基本相同，但没有标题。"
input ImageFilter {
  "图片包含其中任一实体即命中。"
  entityIds: [ID!]
  "图片 ID 命中其中任一即返回，用于按 ID 批量取图片。"
  imageIds: [ID!]
  "图片所属作品包含其中任一艺术家即命中。"
  artistIds: [ID!]

  "要求命中的标签 ID 集合。"
  includeTagIds: [ID!]
  "includeTagIds 的匹配方式，默认全部命中。"
  includeMode: TagMatchMode = ALL
  "includeTagIds 是否递归包含后代标签。"
  expandIncludeTagDescendants: Boolean = false

  "要求排除的标签 ID 集合，图片不能命中其中任何一个。"
  excludeTagIds: [ID!]
  "excludeTagIds 是否递归包含后代标签。"
  expandExcludeTagDescendants: Boolean = false
}

"标签匹配方式。"
enum TagMatchMode {
  "每个请求的标签都至少命中一个。"
  ALL
  "命中任意一个请求的标签即可。"
  ANY
}

"作品排序字段。"
enum ArtworkOrderField {
  CREATED_AT
  PUBLISHED_AT
  TITLE
  "按 sortText 的语义相似度倒序；没有图片向量的作品排在最后。"
  SIMILARITY
}

"排序方向。"
enum SortDirection {
  ASC
  DESC
}

"图片排序字段。"
enum ImageOrderField {
  CREATED_AT
  PUBLISHED_AT
  SCAN_AT
  "按 sortText 或 referenceImageId 的相似度倒序；参考图模式下只返回有向量的图片。"
  SIMILARITY
}

"分页结果。"
type ArtworkConnection {
  "当前页的作品列表，没有结果时为空数组。"
  items: [Artwork!]!
  "是否还有下一页。"
  hasMore: Boolean!
  "总数量；includeTotal 为 false 时为 null，表示未统计。"
  total: Int
  "请求的每页数量。"
  limit: Int!
  "请求的跳过数量。"
  offset: Int!
}

"图片分页结果。"
type ImageConnection {
  "当前页的图片列表，没有结果时为空数组。"
  items: [Image!]!
  "是否还有下一页。"
  hasMore: Boolean!
  "总数量；includeTotal 为 false 时为 null，表示未统计。"
  total: Int
  "请求的每页数量。"
  limit: Int!
  "请求的跳过数量。"
  offset: Int!
}

"游离图片分页结果。"
type OrphanImageConnection {
  "当前页的游离图片列表，没有结果时为空数组。"
  items: [OrphanImage!]!
  "是否还有下一页。"
  hasMore: Boolean!
  "总数量；includeTotal 为 false 时为 null，表示未统计。"
  total: Int
  "请求的每页数量。"
  limit: Int!
  "请求的跳过数量。"
  offset: Int!
}

"不属于任何作品的图片。"
type OrphanImage {
  "图片 ID。"
  id: ID!
  "图片宽度，未知时为 null。"
  width: Int
  "图片高度，未知时为 null。"
  height: Int
  "动画帧数，未知时为 null。"
  frameCount: Int
  "入库时间。"
  createdAt: String!
  "上次扫描时间，从未扫描时为 null。"
  scanAt: String
}

"删除作品的结果。"
type DeleteArtworkResult {
  "是否真的删除了作品；false 表示作品不存在。"
  deleted: Boolean!
  "本次删除释放出来的游离图片数量，不含删除前就已游离的图片。"
  newlyOrphanedImageCount: Int!
}

"已入库的作品。"
type Artwork {
  "作品 ID。"
  id: ID!
  "作品标题。"
  title: String!
  "作品描述，未填写时为 null。"
  description: String
  "原始发布时间，未知时为 null。"
  publishedAt: String
  "创建时间。"
  createdAt: String!
  "最后更新时间。"
  updatedAt: String!

  "图片数量。"
  imageCount: Int!
  "图片 ID 列表，按作品内 position 升序。"
  imageIds: [ID!]!

  "标签 ID 列表。"
  tagIds: [ID!]!
  "标签列表，name 是该标签自身的标准名。"
  tags: [Tag!]!
  "标签路径列表，path 是从根标签到该标签自身、用 :: 连接的路径。"
  tagPaths: [TagPath!]!

  "艺术家 ID 列表。"
  artistIds: [ID!]!
  "艺术家列表。"
  artists: [Artist!]!

  """
  文本相似度分数，仅在 orderBy: SIMILARITY 且提供 sortText 时有值。

  取作品内所有已向量化图片与该文本描述的最高余弦相似度，也就是排序依据；
  作品还没有任何图片向量时为 null。
  """
  sortScore: Float
}

"图片所属的作品摘要。"
type ImageArtwork {
  "作品 ID。"
  id: ID!
  "作品标题。"
  title: String!
  "作品原始发布时间，未知时为 null。"
  publishedAt: String
}

"一张已入库的图片。"
type Image {
  "图片 ID。"
  id: ID!
  "图片宽度，未知时为 null。"
  width: Int
  "图片高度，未知时为 null。"
  height: Int
  "动画帧数，未知时为 null。"
  frameCount: Int
  "入库时间。"
  createdAt: String!
  "上次扫描时间，从未扫描时为 null。"
  scanAt: String
  "所属作品发布时间中的最大值；没有作品或都没填时为 null。"
  publishedAt: String

  "标签 ID 列表。"
  tagIds: [ID!]!
  "标签列表，name 是该标签自身的标准名。"
  tags: [Tag!]!
  "标签路径列表。"
  tagPaths: [TagPath!]!

  "所属作品，按发布时间倒序；没有作品时为空数组。"
  artworks: [ImageArtwork!]!

  """
  文本/参考图相似度分数，仅在 orderBy: SIMILARITY 且提供 sortText 或
  referenceImageId 时有值。

  图片没有向量时为 null；referenceImageId 模式下结果图片都有向量。
  """
  sortScore: Float
}

"标签。"
type Tag {
  "标签 ID。"
  id: ID!
  "标签自身的标准名，例如 1girl。"
  name: String!
  "直接父标签的 ID；没有父标签时为 null。"
  parentId: ID
  "直接父标签的标准名，例如 general；没有父标签时为 null。"
  category: String
  "别名列表，按名称升序。"
  aliases: [String!]!
}

"标签树节点。"
type TagTreeNode {
  "标签 ID。"
  id: ID!
  "直接父标签 ID；顶层标签为 null。"
  parentId: ID
  "标签自身的标准名。"
  name: String!
  "别名列表，按名称升序。"
  aliases: [String!]!
  "从根标签到该标签自身、用 :: 连接的路径。"
  path: String!
  "是否有直接子标签。"
  hasChildren: Boolean!
}

"标签树搜索结果。"
type TagTreeMatch {
  "命中的标签节点。"
  node: TagTreeNode!
  "从根到父级的祖先链，按根到父级排序；命中顶层标签时为空。"
  ancestors: [TagTreeNode!]!
  "命中的标准名或别名。"
  matchedName: String!
  "命中的名称是否为别名。"
  matchedAlias: Boolean!
}

"标签搜索范围。"
input TagSearchScope {
  "父标签 ID；显式传 null 表示只查全局根的直接子标签。"
  parentId: ID
  "是否只查直接子标签；默认 false，表示查整棵子树。"
  directOnly: Boolean = false
}

"标签搜索结果。"
type TagMatch {
  "标签 ID。"
  tagId: ID!
  "命中的名称：标准名或别名。"
  name: String
  "从根标签到该标签自身的路径，例如 wd14scan::general::1girl。"
  tagPath: String
}

"标签路径。"
type TagPath {
  "对应的标签 ID。"
  id: ID!
  "从根标签到该标签自身的路径，例如 wd14scan::general::1girl。"
  path: String!
}

"艺术家。"
type Artist {
  "艺术家 ID。"
  id: ID!
  "艺术家名称。"
  name: String!
}

"提交一次图片扫描任务所需的参数。"
input AddArtworkInput {
  "图片实体 ID，1 到 20 个，不能重复。"
  entityIds: [ID!]!
  "作品标题，1 到 500 个字符。"
  title: String!
  "作品描述，缺省或 null 时写入 NULL。"
  description: String
  "RFC3339 格式的原始发布时间，缺省或 null 时写入 NULL。"
  publishedAt: String
  "已存在的标签 ID，直接挂到作品上。"
  tagIds: [ID!]
  "已存在的艺术家 ID，写入 artwork_artists。"
  artistIds: [ID!]
}

"用已入库的图片新建作品所需的参数。"
input AddArtworkFromImagesInput {
  "图片 ID，1 到 20 个，不能重复。图片可以已经属于其他作品。"
  imageIds: [ID!]!
  "作品标题，1 到 500 个字符。"
  title: String!
  "作品描述，缺省或 null 时写入 NULL。"
  description: String
  "RFC3339 格式的原始发布时间，缺省或 null 时写入 NULL。"
  publishedAt: String
  "已存在的标签 ID，直接挂到作品上。"
  tagIds: [ID!]
  "已存在的艺术家 ID，写入 artwork_artists。"
  artistIds: [ID!]
  "是否重新扫描这些图片；默认 false，只使用 tagIds。"
  rescan: Boolean = false
}

"更新作品所需的参数；至少要提供一项变更。"
input UpdateArtworkInput {
  "新标题；省略或 null 表示不修改，1 到 500 个字符。"
  title: String
  "新发布时间，RFC3339；省略或 null 表示不修改。"
  publishedAt: String
  "为 true 时清空发布时间；不能与 publishedAt 同时提供。"
  clearPublishedAt: Boolean = false
  "要添加的标签 ID；已经挂在该作品上的会忽略。"
  addTagIds: [ID!]
  "要移除的标签 ID；没有挂在该作品上的会忽略。"
  removeTagIds: [ID!]
  """
  该作品完整图片 ID 顺序，最多 200 张；后端按数组顺序写入 position 0..n-1。

  省略或 null 表示不修改图片顺序。提供时必须是当前作品全部图片的完整集合，
  不能借此增删图片；任一图片不存在、重复或不属于该作品都会拒绝整次更新。
  """
  imageIds: [ID!]
}

"批量更新图片所需的参数。"
input UpdateImagesInput {
  "要更新的图片 ID，1 个及以上，不能重复。"
  imageIds: [ID!]!
  "要批量添加的标签 ID；已经挂在这些图片上的会忽略。"
  addTagIds: [ID!]
  "要批量移除的标签 ID；没有挂在这些图片上的会忽略。"
  removeTagIds: [ID!]
}

"创建标签所需的参数。"
input CreateTagInput {
  "标准名，trim 后 1 到 255 个字符，不能包含 :: 或控制字符。"
  name: String!
  "别名列表；按大小写不敏感去重，不能与自身标准名相同。"
  aliases: [String!] = []
  "父标签 ID；省略或 null 时创建在根节点下。"
  parentId: ID
}

"更新标签所需的参数；至少要提供一项变更。"
input UpdateTagInput {
  "新标准名；省略或 null 表示不修改。旧标准名直接覆盖，不自动转别名。"
  name: String
  """
  完整别名列表；省略或 null 表示不修改，空数组表示清空。

  按大小写不敏感去重；最终列表中不能包含最终标准名。
  """
  aliases: [String!]
  "新父标签 ID；省略或 null 表示不修改。"
  parentId: ID
  "为 true 时移到根节点；不能与 parentId 同时提供。"
  clearParent: Boolean = false
}

"根变更类型。"
type Mutation {
  """
  提交一个图片扫描任务，立即返回任务 ID。

  任务完成瞬间即被丢弃，服务端不保存终态，也没有任务查询接口。
  扫描结果只体现在后续的作品列表/搜索中，失败原因只写入服务端日志。
  """
  addArtwork(input: AddArtworkInput!): ID!

  """
  用已有图片 ID 新建作品，立即返回任务 ID。

  rescan 为 false 时只建立图片关联，作品标签只来自 tagIds。
  rescan 为 true 时逐张重新扫描并合并扫描标签；任一图片失败则整单不写库。
  图片可以已经属于其他作品。
  """
  addArtworkFromImages(input: AddArtworkFromImagesInput!): ID!

  """
  重新扫描一个作品内的全部图片，立即返回任务 ID。

  先逐张重新下载、打标并生成向量；只有全部图片都成功才会写库，否则整单
  不写，作品的旧向量与旧标签保持原样。成功时按图片替换 Chinese-CLIP
  向量，并把本次扫描出的标签增量加入作品（只增不删）。
  与 addArtwork 一样不保存终态，结果只体现在后续查询里。
  """
  rescanArtwork(artworkId: ID!): ID!

  """
  删除一个作品及其标签、画师关联。

  图片行本身保留；只属于这个作品的图片会变成游离图片。
  作品不存在时返回 deleted: false，不报错。
  """
  deleteArtwork(id: ID!): DeleteArtworkResult!

  """
  更新作品的标题、发布时间和标签，返回作品 ID。

  标签按增量处理：addTagIds 添加、removeTagIds 移除，已经存在或未挂载的
  标签会被忽略。删除发布时间时传 clearPublishedAt: true。
  """
  updateArtwork(id: ID!, input: UpdateArtworkInput!): ID!

  """
  创建一个标签。

  不传 parentId 时创建在根节点下；同一父标签下标准名必须唯一（忽略大小写）。
  返回创建后的完整标签。
  """
  createTag(input: CreateTagInput!): Tag!

  """
  更新标签的标准名、别名或父级，返回更新后的完整标签。

  name 省略表示不改名；aliases 省略表示不改别名，传空数组表示清空；
  parentId 省略表示不移动，clearParent: true 表示移到根节点。
  至少需要提供一项变更。
  """
  updateTag(id: ID!, input: UpdateTagInput!): Tag!

  """
  批量更新图片，返回成功处理的图片数量。

